<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi cuenta | Sabor Limeño</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/usuario.css"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

<style>
    html {
        visibility: hidden;
    }
</style>

</head>



<body>

    <div id="side_navbar"></div>


    <main class="usuario" id="usuario">

        <section class="usuario-header">

            <h1>Mi cuenta</h1>

            <p>
                Aquí puedes consultar tus datos personales.
            </p>

        </section>


        <section class="perfil-contenido">

            <div class="perfil-datos">

                <div class="perfil-dato">

                    <span>RUN</span>

                    <p id="perfilRun"></p>

                </div>


                <div class="perfil-dato">

                    <span>Nombre completo</span>

                    <p id="perfilNombre"></p>

                </div>


                <div class="perfil-dato">

                    <span>Dirección</span>

                    <p id="perfilDireccion"></p>

                </div>


                <div class="perfil-dato">

                    <span>Comuna</span>

                    <p id="perfilComuna"></p>

                </div>


                <div class="perfil-dato">

                    <span>Provincia</span>

                    <p id="perfilProvincia"></p>

                </div>


                <div class="perfil-dato">

                    <span>Región</span>

                    <p id="perfilRegion"></p>

                </div>


                <div class="perfil-dato">

                    <span>Fecha de nacimiento</span>

                    <p id="perfilFechaNacimiento"></p>

                </div>


                <div class="perfil-dato">

                    <span>Sexo</span>

                    <p id="perfilSexo"></p>

                </div>


                <div class="perfil-dato">

                    <span>Correo electrónico</span>

                    <p id="perfilCorreo"></p>

                </div>


                <div class="perfil-dato">

                    <span>Número telefónico</span>

                    <p id="perfilTelefono"></p>

                </div>

            </div>


            <div class="perfil-acciones">

                <button
                    type="button"
                    class="boton-formulario"
                    onclick="window.location.href='mispedidos.html'"
                >
                    Mis pedidos
                </button>


                <button
                    type="button"
                    class="boton-cerrar-sesion"
                    onclick="cerrarSesion()"
                >
                    Cerrar sesión
                </button>
                
                <button
                    type="button"
                    class="boton-actualizar-datos"
                    onclick="actualizarDatos()"
                >
                    actualizar Datos
                </button>
                <button
                    type="button"
                    id="btn_admin"
                    class="btn btn-outline-danger"
                    style="display: none;"
                    onclick="window.location.href='../html_admin/index.html'"
                >
                    <i class="bi bi-speedometer2 me-2"></i>
                    Panel administrativo
                </button>

            </div>

        </section>

    </main>


    <div id="mifooter"></div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="../js/ui.js"></script>
    <script src="../js/usuario.js"></script>
    <script src="../js/carrito.js"></script>

</body>

</html>
