<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/menu.css">

    <title>Menú</title>
</head>

<body>

    <header class="menu-header">
        <img src="../img/logo.png" alt="Logo del restaurante">
    </header>

    <div id="side_navbar"></div>


    <section class="destacados">

        <h2>Productos destacados</h2>

        <div class="carrusel-container">

            <button class="carrusel-btn izquierda">&#10094;</button>

            <div class="productos-carrusel">
                <!-- Productos generados desde JS -->
            </div>

            <button class="carrusel-btn derecha">&#10095;</button>

        </div>

    </section>


    <main class="menu">

        <section class="categoria">
            <h2>Entradas</h2>

            <div class="productos" id="entradas">
                <!-- Productos generados desde JS -->
            </div>
        </section>


        <section class="categoria">
            <h2>Fondos</h2>

            <div class="productos" id="fondos">
                <!-- Productos generados desde JS -->
            </div>
        </section>


        <section class="categoria">
            <h2>Bebestibles</h2>

            <div class="productos" id="bebestibles">
                <!-- Productos generados desde JS -->
            </div>
        </section>


        <section class="categoria">
            <h2>Postres</h2>

            <div class="productos" id="postres">
                <!-- Productos generados desde JS -->
            </div>
        </section>

    </main>
        <div id="mifooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/usuario.js"></script>
    <script src="../js/carrito.js"></script>

</body>
</html>
