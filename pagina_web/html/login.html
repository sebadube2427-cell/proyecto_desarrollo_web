<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Sabor Limeño</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/usuario.css"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

</head>


<body>

    <div id="side_navbar"></div>


    <main class="usuario">

        <section class="usuario-header">

            <h1>Iniciar sesión</h1>

            <p>
                Ingresa a tu cuenta para realizar compras
                y acceder a tus pedidos.
            </p>

        </section>


        <section class="usuario-formulario login-formulario">

            <form id="formLogin">

                <div class="formulario-grupo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="formulario-grupo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <p
                    id="mensajeLogin"
                    class="mensaje-formulario"
                ></p>


                <button
                    type="submit"
                    class="boton-formulario"
                >
                    Iniciar sesión
                </button>


                <p class="formulario-enlace">

                    ¿No tienes una cuenta?

                    <a href="registro.html">
                        Registrarse
                    </a>

                </p>

            </form>

        </section>

    </main>


    <div id="mifooter"></div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="../js/ui.js"></script>
    <script src="../js/usuario.js"></script>
    <script src="../js/carrito.js"></script>

</body>

</html>
