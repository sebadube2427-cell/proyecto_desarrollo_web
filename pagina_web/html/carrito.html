<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Carrito | Sabor Limeño</title>

        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/carrito.css">

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        >

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        >
    </head>

    <body>

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Sabores del Perú</a>

                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Inicio</a>
                    <a class="nav-link" href="menu.html">Menú</a>
                    <a class="nav-link" href="contacto.html">Contacto</a>
                    <a class="nav-link active" href="carrito.html">Carrito</a>
                </div>
            </div>
        </nav>



        <main class="carrito">

            <section class="carrito-header">

                <h1>Tu carrito</h1>

                <p>
                    Revisa tus productos antes de realizar tu pedido.
                </p>

            </section>


            <section class="carrito-contenido">

                <div class="carrito-productos">
                    <!-- Productos generados desde carrito.js -->
                </div>

                <aside class="carrito-resumen">

                    <h2>Resumen del pedido</h2>

                    <div class="resumen-linea">
                        <span>Subtotal</span>
                        <span>$0</span>
                    </div>

                    <div class="resumen-linea">
                        <span>Envío</span>
                        <span>$0</span>
                    </div>

                    <div class="resumen-separador"></div>

                    <div class="resumen-total">
                        <span>Total</span>
                        <span>$0</span>
                    </div>

                    <button class="boton-pedido">
                        Realizar pedido
                    </button>

                </aside>

            </section>

        </main>


        <div id="mifooter"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/ui.js"></script>
        <script src="../js/usuario.js"></script>
        <script src="../js/carrito.js"></script>

    </body>

</html>
