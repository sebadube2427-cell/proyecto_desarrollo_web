<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | Sabor Limeño</title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <link
        rel="stylesheet"
        href="../css/usuario.css"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

</head>


<body>

    <div id="side_navbar"></div>


    <main class="usuario">

        <section class="usuario-header">

            <h1>Crear cuenta</h1>

            <p>
                Regístrate para realizar compras y acceder
                a promociones y ofertas.
            </p>

        </section>


        <section class="usuario-formulario">

            <form id="formRegistro">


                <div class="formulario-grupo">

                    <label for="run">
                        RUN
                    </label>

                    <input
                        type="text"
                        id="run"
                        name="run"
                        placeholder="Ej: 12.345.678-9"
                        required
                    >

                </div>


                <div class="formulario-grupo">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre completo"
                        required
                    >

                </div>


                <div class="formulario-grupo">

                    <label for="direccion">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        name="direccion"
                        placeholder="Ingresa tu dirección"
                        required
                    >

                </div>


                <div class="formulario-fila">

                    <div class="formulario-grupo">

                        <label for="comuna">
                            Comuna
                        </label>

                        <input
                            type="text"
                            id="comuna"
                            name="comuna"
                            required
                        >

                    </div>


                    <div class="formulario-grupo">

                        <label for="provincia">
                            Provincia
                        </label>

                        <input
                            type="text"
                            id="provincia"
                            name="provincia"
                            required
                        >

                    </div>

                </div>


                <div class="formulario-grupo">

                    <label for="region">
                        Región
                    </label>

                    <input
                        type="text"
                        id="region"
                        name="region"
                        required
                    >

                </div>


                <div class="formulario-fila">

                    <div class="formulario-grupo">

                        <label for="fechaNacimiento">
                            Fecha de nacimiento
                        </label>

                        <input
                            type="date"
                            id="fechaNacimiento"
                            name="fechaNacimiento"
                            required
                        >

                    </div>


                    <div class="formulario-grupo">

                        <label for="sexo">
                            Sexo
                        </label>

                        <select
                            id="sexo"
                            name="sexo"
                            required
                        >

                            <option value="">
                                Seleccionar
                            </option>

                            <option value="femenino">
                                Femenino
                            </option>

                            <option value="masculino">
                                Masculino
                            </option>

                            <option value="otro">
                                Otro
                            </option>

                            <option value="prefiero-no-decirlo">
                                Prefiero no decirlo
                            </option>

                        </select>

                    </div>

                </div>


                <div class="formulario-grupo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="formulario-grupo">

                    <label for="telefono">
                        Número telefónico
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="+56 9 1234 5678"
                        required
                    >

                </div>


                <div class="formulario-grupo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        required
                    >

                </div>


                <div class="formulario-grupo">

                    <label for="confirmarContrasena">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="confirmarContrasena"
                        name="confirmarContrasena"
                        required
                    >

                </div>


                <p
                    id="mensajeRegistro"
                    class="mensaje-formulario"
                ></p>


                <button
                    type="submit"
                    class="boton-formulario"
                >
                    Registrarse
                </button>


                <p class="formulario-enlace">

                    ¿Ya tienes una cuenta?

                    <a href="login.html">
                        Iniciar sesión
                    </a>

                </p>


            </form>

        </section>

    </main>


    <div id="mifooter"></div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="../js/ui.js"></script>
    <script src="../js/usuario.js"></script>
    <script src="../js/carrito.js"></script>

</body>

</html>
